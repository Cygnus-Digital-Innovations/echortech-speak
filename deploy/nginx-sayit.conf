# Say It: nginx site on the shared health-monitor server.
# Installed at /etc/nginx/conf.d/sayit.conf. Adds a new server_name only.
#
# Logging is off on purpose. Access logs would record the IP address of
# anonymous senders. Client addresses are also not forwarded to the app.

server {
    listen 80;
    listen [::]:80;
    server_name sayit.echortech.com;
    access_log off;
    error_log /dev/null crit;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sayit.echortech.com;
    access_log off;
    error_log /dev/null crit;

    ssl_certificate     /etc/letsencrypt/live/sayit.echortech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sayit.echortech.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100k;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
